# Production stack, behind the server's Traefik (network "web", entrypoint "websecure", resolver "le").
#   docker compose up -d --build     (scripts/deploy.sh does this)
# The server's .env (next to this file, never committed) needs:
#   RULEMAVEN_HOST=rulemaven.com
#   SECRET_KEY_BASE=<mix phx.gen.secret>
#   POSTGRES_PASSWORD=<random>
# Single sign-on (shared Authentik, ../identity blueprints/rulemaven.yaml) is off until
# RULEMAVEN_OIDC_ISSUER is set; then RULEMAVEN_OIDC_CLIENT_SECRET (same value as in
# /opt/identity/.env) is required too and passwords stop working. The rest default to the
# Low-Cal Calzone Zone sign-in:
#   RULEMAVEN_OIDC_ISSUER=https://id.lowcalcalzonezone.com/application/o/rulemaven/
#   RULEMAVEN_OIDC_CLIENT_SECRET=<openssl rand -hex 32>
#   RULEMAVEN_HUB_SECRET=<random>   (optional: lets the hub read /api/hub/summary)
# Data lives in bind mounts under ./data: postgres/ (database), files/ (uploaded rulebooks,
# symbol crops; UPLOADS_DIR), backups/ (pg_dump files written by scripts/deploy.sh).
services:
  rulemaven:
    # Memory cap (OPERATIONS.md §2): a runaway is killed and restarted here instead of starving
    # the other apps; the health check reports any kill.
    mem_limit: 2g
    # A tiny init as PID 1 reaps finished child processes (the release's epmd), which otherwise stay as zombies.
    init: true
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_HOST: ${RULEMAVEN_HOST:?set RULEMAVEN_HOST in .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      DATABASE_URL: ecto://rulemaven:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/rulemaven
      POOL_SIZE: ${POOL_SIZE:-20}
      # Single sign-on: empty issuer = off (the app refuses to start with an issuer but no secret).
      RULEMAVEN_OIDC_ISSUER: ${RULEMAVEN_OIDC_ISSUER:-}
      RULEMAVEN_OIDC_CLIENT_ID: ${RULEMAVEN_OIDC_CLIENT_ID:-rulemaven}
      RULEMAVEN_OIDC_CLIENT_SECRET: ${RULEMAVEN_OIDC_CLIENT_SECRET:-}
      RULEMAVEN_OIDC_GROUP: ${RULEMAVEN_OIDC_GROUP:-rulemaven-users}
      RULEMAVEN_OIDC_ADMIN_GROUP: ${RULEMAVEN_OIDC_ADMIN_GROUP:-rulemaven-admins}
      RULEMAVEN_OIDC_SUPERADMIN_GROUP: ${RULEMAVEN_OIDC_SUPERADMIN_GROUP:-rulemaven-superadmins}
      RULEMAVEN_OIDC_NAME: ${RULEMAVEN_OIDC_NAME:-Low-Cal Calzone Zone}
      # Lets the Low-Cal Calzone Zone hub (../hub) read each person's summary (/api/hub/summary). Unset: refused.
      RULEMAVEN_HUB_SECRET: ${RULEMAVEN_HUB_SECRET:-}
    # The container runs as uid 1000 (the deploy user): ./data/files must be owned by it.
    volumes:
      - ./data/files:/data/files
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [default, web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.rulemaven.rule=Host(`${RULEMAVEN_HOST}`)
      - traefik.http.routers.rulemaven.entrypoints=websecure
      - traefik.http.routers.rulemaven.tls.certresolver=le
      - traefik.http.routers.rulemaven.service=rulemaven
      # Deploys: a request that reaches the retiring container while it shuts down is retried on the new one.
      - traefik.http.routers.rulemaven.middlewares=rulemaven-retry
      - traefik.http.middlewares.rulemaven-retry.retry.attempts=3
      - traefik.http.middlewares.rulemaven-retry.retry.initialinterval=100ms
      - traefik.http.services.rulemaven.loadbalancer.server.port=4000

  # One-off commands against production (imports, audits, psql), run from a Mac via bin/prod:
  #   docker compose run --rm -T tools mix rule_maven.import_pages ...
  # The build-stage image (Elixir + mix, python3, psql) on this checkout, as the deploy user,
  # with Oban queues OFF: it only inserts jobs; the running app executes them.
  tools:
    profiles: [tools]
    build:
      context: .
      target: build
    image: rulemaven-tools
    user: "1000:1000"
    working_dir: /src
    entrypoint: ["/src/bin/tools-entrypoint"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      RULEMAVEN_TOOLS: "1"
      HOME: /src/data/tools/home
      HEX_HOME: /src/data/tools/hex
      PHX_HOST: ${RULEMAVEN_HOST:?set RULEMAVEN_HOST in .env}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      DATABASE_URL: ecto://rulemaven:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/rulemaven
      UPLOADS_DIR: /data/files
      PGHOST: db
      PGUSER: rulemaven
      PGDATABASE: rulemaven
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/src
      - ./data/files:/data/files
    networks: [default]

  db:
    mem_limit: 1g
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: rulemaven
      POSTGRES_DB: rulemaven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # pg18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes:
      - ./data/postgres:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulemaven -d rulemaven"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Only the app reaches it: no published port, not on the Traefik network.
    networks: [default]

networks:
  web:
    external: true
