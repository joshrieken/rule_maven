# Every push to master and every pull request (Dependabot's too): compile without warnings, formatting, and the
# full test suite including the browser tests (credo is left out until its old warnings are cleared).
name: Checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assets/package-lock.json
      # The Playwright CLI and Chromium for phoenix_test_playwright's browser tests.
      - run: npm ci --prefix assets --no-audit --no-fund
      - run: npx --prefix assets playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
